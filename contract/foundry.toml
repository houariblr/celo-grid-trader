[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# إعدادات المترجم لحل مشكلة Stack Too Deep
via_ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
celo_sepolia = "https://celo-sepolia.drpc.org"

[etherscan]
# هنا كان الخطأ، التنسيق الصحيح يجب أن يكون هكذا:
celo_sepolia = { key = "any", url = "https://api-sepolia.celoscan.io/api" }
